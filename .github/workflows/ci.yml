name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: system
          POSTGRES_PASSWORD: passw0rd
          POSTGRES_DB: promenade_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install dependencies
        run: |
          go mod download
          go mod tidy

      - name: Run migrations
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: system
          DB_PASSWORD: passw0rd
          DB_NAME: promenade_test
        run: |
          go run cmd/migrate/main.go --cmd=up --namespace=core
          go run cmd/migrate/main.go --cmd=up --namespace=shared
          go run cmd/migrate/main.go --cmd=up --namespace=identity
          go run cmd/migrate/main.go --cmd=up --namespace=customer-mgmt

      - name: Run unit tests
        run: make test-unit

      - name: Run smoke tests
        run: make test-smoke

      - name: Run integration tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: system
          DB_PASSWORD: passw0rd
          DB_NAME: promenade_test
          REDIS_ADDR: localhost:6379
        run: make test-integration

      - name: Run all tests with race detector
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: system
          DB_PASSWORD: passw0rd
          DB_NAME: promenade_test
          REDIS_ADDR: localhost:6379
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
          cache: false

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Build
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: promenade
          path: bin/promenade
