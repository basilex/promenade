# Posts Module - Production Configuration

module:
  name: "posts"
  enabled: true
  version: "1.0.0"

# Production settings - strict limits for performance
posts:
  max_title_length: 200
  max_content_length: 100000
  max_excerpt_length: 500
  slug_max_length: 255
  auto_publish: false

  comments:
    enabled: true
    max_content_length: 2000
    max_depth: 10
    moderation_enabled: true # Enable moderation in production
    allow_anonymous: false
    spam_filter_enabled: true

  likes:
    enabled: true
    allow_multiple: false
    rate_limit_per_user: 100 # Max likes per hour

# Production purge - standard retention
purge:
  enabled: true

  posts:
    retention_days: 90
    batch_size: 500 # Larger batches for efficiency

  comments:
    retention_days: 30
    batch_size: 500

permissions:
  - resource: "posts"
    actions: ["create", "read", "update", "delete", "manage"]
  - resource: "comments"
    actions: ["create", "read", "update", "delete", "manage"]
  - resource: "likes"
    actions: ["create", "delete"]

# Production feature flags
features:
  rich_text_editor: true
  image_upload: true
  video_embed: true
  mention_users: true
  hashtags: true
  drafts: true
  scheduling: true
  analytics: true

# Production-specific
production:
  cdn_enabled: true
  cache_enabled: true
  search_indexing: true
  notifications:
    new_comment: true
    new_like: false # Too noisy
    mention: true
