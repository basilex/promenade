module:
  enabled: true
  license_required: false # Set to true for production

# Audit event signature secret (override via AUDIT_SECRET env var)
audit:
  signature_secret: "dev-audit-secret-key-change-in-production"

# License configuration (for commercial deployment)
license:
  key: "" # Set via AUDIT_LICENSE_KEY environment variable
  validation:
    check_on_startup: true
    check_on_request: false
  grace_period_days: 3

# Retention policy
retention:
  enabled: true
  days: 365 # Keep audit logs for 1 year (BASIC tier)

# Purge schedule (cron format)
purge:
  enabled: true
  schedule: "0 2 * * *" # Run at 2 AM daily
