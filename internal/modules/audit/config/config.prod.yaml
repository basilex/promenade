module:
  enabled: true
  license_required: true # REQUIRED in production

audit:
  signature_secret: "" # MUST set via AUDIT_SECRET environment variable

license:
  key: "" # MUST set via AUDIT_LICENSE_KEY environment variable
  validation:
    check_on_startup: true
    check_on_request: true
  grace_period_days: 3

# Retention policy based on license tier
# BASIC: 30 days, PRO: 365 days, ENTERPRISE: unlimited
retention:
  enabled: true
  days: 365 # Override based on license tier

purge:
  enabled: true
  schedule: "0 3 * * *" # Run at 3 AM daily
