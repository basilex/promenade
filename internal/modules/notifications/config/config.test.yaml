module:
  name: "notifications"
  enabled: true
  version: "1.0.0"
  license_required: false # License check disabled for tests

notifications:
  rate_limit:
    enabled: false # Disabled for tests
    max_per_user_per_minute: 100
    max_per_user_per_hour: 1000

  retry:
    enabled: true
    max_attempts: 1 # No retries in tests
    backoff_seconds: 1

  batch:
    size: 10
    interval_seconds: 1

  channels:
    email:
      enabled: true
      from_address: "test@promenade.test"
      from_name: "Promenade Test"
    sms:
      enabled: false
    push:
      enabled: true
    in_app:
      enabled: true
