module:
  name: "notifications"
  enabled: true
  version: "1.0.0"
  license_required: true

notifications:
  rate_limit:
    enabled: true
    max_per_user_per_minute: 3
    max_per_user_per_hour: 50

  retry:
    enabled: true
    max_attempts: 5
    backoff_seconds: 300

  batch:
    size: 500
    interval_seconds: 30

  channels:
    email:
      enabled: true
      from_address: "${NOTIFICATIONS_EMAIL_FROM}"
      from_name: "${NOTIFICATIONS_EMAIL_NAME}"
    sms:
      enabled: true
      provider: "${SMS_PROVIDER}"
      api_key: "${SMS_API_KEY}"
    push:
      enabled: true
      provider: "${PUSH_PROVIDER}"
      api_key: "${PUSH_API_KEY}"
    in_app:
      enabled: true
