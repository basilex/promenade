# Profiles Module - Production Configuration

module:
  name: "profiles"
  enabled: true
  version: "1.0.0"

profiles:
  max_bio_length: 500
  max_display_name_length: 100
  allow_custom_urls: true
  avatar_upload_enabled: true
  max_avatar_size_mb: 2 # Smaller in production

  social_links:
    max_count: 10
    allowed_platforms:
      - "twitter"
      - "linkedin"
      - "github"
      - "facebook"
      - "instagram"
      - "youtube"
      - "tiktok"
      - "medium"

  validation:
    username_pattern: "^[a-zA-Z0-9_-]{3,30}$"
    profanity_filter_enabled: true

permissions:
  - resource: "profiles"
    actions: ["read", "update", "manage"]

features:
  public_profiles: true
  profile_search: true
  profile_verification: true
  custom_themes: true
  profile_analytics: true

production:
  cdn_enabled: true
  cache_ttl: 300 # 5 minutes
  image_optimization: true
