workflows:
  enabled: true
  version: "1.0.0"

  # License (not required for testing)
  license_key: ""
  license_required: false

  # Execution settings (lower limits for testing)
  execution:
    max_concurrent_instances: 10
    step_timeout_default: "30s"
    instance_timeout_default: "5m"
    enable_parallel_execution: true
    worker_pool_size: 2

  # Retry policy defaults
  retry:
    max_attempts: 2
    initial_interval: "100ms"
    multiplier: 2.0
    max_interval: "5s"

  # Activity settings
  activities:
    http_timeout: "10s"
    email_enabled: false # Disable email in tests
    script_engine: "javascript"
    script_timeout: "5s"

  # Monitoring
  monitoring:
    enable_metrics: false
    enable_tracing: false
    slow_step_threshold: "5s"

  # Cleanup (shorter retention for tests)
  purge:
    enabled: true
    completed_instances_days: 7
    failed_instances_days: 14
    steps_retention_days: 7
    variables_retention_days: 7
    events_retention_days: 3
    run_schedule: "0 * * * *" # Hourly for testing
