workflows:
  enabled: true
  version: "1.0.0"

  # Commercial license (REQUIRED in production)
  license_key: "" # MUST set via WORKFLOWS_LICENSE_KEY env var
  license_required: true # Enforce license check in production

  # Execution settings (production scale)
  execution:
    max_concurrent_instances: 10000
    step_timeout_default: "10m"
    instance_timeout_default: "48h"
    enable_parallel_execution: true
    worker_pool_size: 20

  # Retry policy defaults
  retry:
    max_attempts: 5
    initial_interval: "2s"
    multiplier: 2.0
    max_interval: "5m"

  # Activity settings
  activities:
    http_timeout: "60s"
    email_enabled: true
    script_engine: "javascript"
    script_timeout: "30s"

  # Monitoring
  monitoring:
    enable_metrics: true
    enable_tracing: true
    slow_step_threshold: "15s"

  # Cleanup (compliance-driven retention)
  purge:
    enabled: true
    completed_instances_days: 365 # Keep completed for 1 year
    failed_instances_days: 730 # Keep failed for 2 years (compliance)
    steps_retention_days: 365
    variables_retention_days: 365
    events_retention_days: 180
    run_schedule: "0 2 * * *" # Daily at 2 AM
