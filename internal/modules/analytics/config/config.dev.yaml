module:
  name: "analytics"
  enabled: true
  version: "1.0.0"
  description: "Analytics and reporting module (Free)"

analytics:
  # Metrics collection
  metrics:
    enabled: true
    aggregation_interval: "1h" # Aggregate metrics every hour
    retention_days: 90 # Keep raw metrics for 90 days

  # Reports
  reports:
    max_per_user: 10
    max_export_rows: 10000
    allowed_formats:
      - "json"
      - "csv"
      - "pdf"

  # Dashboards
  dashboards:
    max_per_user: 5
    max_widgets: 20
