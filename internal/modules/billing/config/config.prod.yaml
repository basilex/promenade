# Billing Module Configuration - Production Environment
# This file contains billing module settings for production deployment

module:
  name: "billing"
  display_name: "Billing Management"
  version: "1.0.0"
  enabled: true
  author: "Promenade Team"
  description: "Subscription billing and payment processing"
  license: "Commercial"

billing:
  # Default settings
  default_currency: "USD"
  default_trial_days: 14

  # Invoice settings
  invoice:
    auto_finalize: true # Auto-finalize invoices in production
    due_days: 14 # Payment due in 14 days
    overdue_grace_days: 7 # Grace period before marking overdue
    auto_number_format: "INV-%Y%m%d-%06d"

  # Subscription settings
  subscription:
    allow_multiple_active: false
    auto_renew_enabled: true
    renewal_reminder_days: 7

  # Payment providers (use environment variables for secrets)
  providers:
    stripe:
      enabled: true
      public_key: "" # Set via STRIPE_PUBLIC_KEY env var
      secret_key: "" # Set via STRIPE_SECRET_KEY env var (REQUIRED)
      webhook_secret: "" # Set via STRIPE_WEBHOOK_SECRET env var (REQUIRED)

    liqpay:
      enabled: true
      public_key: "" # Set via LIQPAY_PUBLIC_KEY env var
      private_key: "" # Set via LIQPAY_PRIVATE_KEY env var (REQUIRED)
      sandbox: false # Production mode

    paypal:
      enabled: true
      client_id: "" # Set via PAYPAL_CLIENT_ID env var
      client_secret: "" # Set via PAYPAL_CLIENT_SECRET env var (REQUIRED)
      sandbox: false # Production mode

  # Limits and validation
  limits:
    max_refund_days: 30
    max_subscription_duration_years: 5
    min_payment_amount: 100

  # Notifications (all enabled in production)
  notifications:
    send_invoice_emails: true
    send_payment_receipts: true
    send_subscription_reminders: true
    send_payment_failed_alerts: true

# Data retention policies (strict compliance)
purge:
  billing_invoices:
    retention_days: 2555 # 7 years (legal requirement for financial records)
    enabled: true

  billing_payments:
    retention_days: 2555 # 7 years (legal requirement)
    enabled: true

  billing_subscriptions:
    retention_days: 1095 # 3 years for canceled/expired subscriptions
    enabled: true
    condition: "status = 'canceled' OR status = 'expired'"

# Licensing (REQUIRED in production)
license:
  required: true
  key: "" # Set via BILLING_LICENSE_KEY env var (REQUIRED)

# Feature flags
features:
  enable_refunds: true
  enable_upgrades: true
  enable_downgrades: true
  enable_proration: true
  enable_trial_periods: true
  enable_coupons: false # Future feature
  enable_credits: false # Future feature

# Security settings
security:
  require_3d_secure: true # Require 3D Secure for card payments
  fraud_detection_enabled: true
  max_failed_payment_attempts: 3

# Monitoring and alerts
monitoring:
  alert_on_failed_payments: true
  alert_on_subscription_cancellations: true
  alert_on_refund_requests: true
  track_conversion_metrics: true
