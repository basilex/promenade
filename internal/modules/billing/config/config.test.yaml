# Billing Module Configuration - Test Environment
# This file contains billing module settings for automated testing

module:
  name: "billing"
  display_name: "Billing Management"
  version: "1.0.0"
  enabled: true
  author: "Promenade Team"
  description: "Subscription billing and payment processing"
  license: "Commercial"

billing:
  # Default settings
  default_currency: "USD"
  default_trial_days: 7 # Shorter trial for tests

  # Invoice settings
  invoice:
    auto_finalize: false
    due_days: 3 # Shorter for tests
    overdue_grace_days: 1
    auto_number_format: "INV-%Y%m%d-%06d"

  # Subscription settings
  subscription:
    allow_multiple_active: false
    auto_renew_enabled: false # Manual control in tests
    renewal_reminder_days: 3

  # Payment providers (all use mock/test mode)
  providers:
    stripe:
      enabled: true
      public_key: "pk_test_mock"
      secret_key: "sk_test_mock"
      webhook_secret: "whsec_test_mock"

    liqpay:
      enabled: true
      public_key: "test_liqpay_public"
      private_key: "test_liqpay_private"
      sandbox: true

    paypal:
      enabled: true
      client_id: "test_paypal_client"
      client_secret: "test_paypal_secret"
      sandbox: true

  # Limits and validation
  limits:
    max_refund_days: 30
    max_subscription_duration_years: 5
    min_payment_amount: 100

  # Notifications (disabled in tests)
  notifications:
    send_invoice_emails: false
    send_payment_receipts: false
    send_subscription_reminders: false
    send_payment_failed_alerts: false

# Data retention policies
purge:
  billing_invoices:
    retention_days: 30 # Short retention for tests
    enabled: false # Disabled in tests

  billing_payments:
    retention_days: 30
    enabled: false

  billing_subscriptions:
    retention_days: 30
    enabled: false

# Licensing
license:
  required: false # Not required in tests
  key: ""

# Feature flags (all enabled for testing)
features:
  enable_refunds: true
  enable_upgrades: true
  enable_downgrades: true
  enable_proration: true
  enable_trial_periods: true
  enable_coupons: false
  enable_credits: false
