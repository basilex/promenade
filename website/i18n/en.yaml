# About Section
about_title: "Why Promenade?"
about_intro: "Building REST APIs shouldn't mean writing the same boilerplate code over and over. Promenade gives you a production-ready foundation so you can focus on what matters: your business logic."

about_point1_title: "For Startups & SaaS"
about_point1_desc: "Launch faster with built-in authentication, RBAC, event-driven architecture, and multi-tenancy support. Everything you need to go from MVP to production."

about_point2_title: "For Enterprise Teams"
about_point2_desc: "Proven architecture patterns, comprehensive testing, audit trails, and compliance-ready features. Scale confidently with modular design that grows with your needs."

about_point3_title: "For Developers"
about_point3_desc: "Clean, well-documented code following industry best practices. Focus on features, not infrastructure. Plug in only what you need."

about_point4_title: "For DevOps & Operations"
about_point4_desc: "Docker-ready, automated migrations, health checks, and observability built-in. Production-tested with comprehensive logging and monitoring. Deploy with confidence."

# Features
features_title: "Key Features"
feature_architecture_title: "Clean Architecture"
feature_architecture_desc: "Strict layered architecture with Domain → Use Case → Adapter → Infrastructure. True separation of concerns."

feature_modules_title: "Plugin Modules"
feature_modules_desc: "Independent vertical slices with own entities, migrations, and lifecycle. Enable/disable without affecting core."

feature_database_title: "PostgreSQL + UUID v7"
feature_database_desc: "Time-ordered UUIDs for 2x faster inserts. Namespace-based migrations for true module autonomy."

feature_auth_title: "Security Built-in"
feature_auth_desc: "JWT authentication, RBAC with wildcard permissions, session management, and audit logging."

feature_events_title: "Event-Driven"
feature_events_desc: "Dual-adapter event bus (Memory/Redis) for async operations and inter-module communication."

feature_testing_title: "Comprehensive Testing"
feature_testing_desc: "500+ tests across all layers. Unit, integration, and smoke tests. 100% passing in under 25 seconds."

