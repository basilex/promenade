# About Section / Про Проект
about_title: "Чому Promenade?"
about_intro: "Створення REST API не має означати написання одного й того ж boilerplate коду знову і знову. Promenade дає вам продакшн-готову основу, щоб ви могли зосередитись на головному: вашій бізнес-логіці."

about_point1_title: "Для Стартапів і SaaS"
about_point1_desc: "Запускайтесь швидше з вбудованою автентифікацією, RBAC, event-driven архітектурою та підтримкою multi-tenancy. Все необхідне для переходу від MVP до продакшену."

about_point2_title: "Для Enterprise Команд"
about_point2_desc: "Перевірені архітектурні патерни, комплексне тестування, audit trails та compliance-ready функції. Масштабуйтесь впевнено з модульним дизайном."

about_point3_title: "Для Розробників"
about_point3_desc: "Чистий, добре задокументований код за найкращими практиками індустрії. Зосередьтесь на функціях, а не на інфраструктурі. Підключайте тільки те, що потрібно."

# Features / Можливості
features_title: "Ключові Можливості"
feature_architecture_title: "Clean Architecture"
feature_architecture_desc: "Чітка шарова архітектура: Domain → Use Case → Adapter → Infrastructure. Справжнє розділення відповідальності."

feature_modules_title: "Модулі-Плагіни"
feature_modules_desc: "Незалежні вертикальні зрізи з власними entity, міграціями та lifecycle. Вмикай/вимикай без впливу на core."

feature_database_title: "PostgreSQL + UUID v7"
feature_database_desc: "Часово-впорядковані UUID для 2x швидших вставок. Міграції на основі namespace для справжньої автономії модулів."

feature_auth_title: "Вбудована Безпека"
feature_auth_desc: "JWT автентифікація, RBAC з wildcard правами, управління сесіями та audit логування."

feature_events_title: "Event-Driven"
feature_events_desc: "Подвійний event bus адаптер (Memory/Redis) для асинхронних операцій та міжмодульної комунікації."

feature_testing_title: "Комплексне Тестування"
feature_testing_desc: "500+ тестів на всіх шарах. Unit, integration та smoke тести. 100% успішно менше ніж за 25 секунд."

