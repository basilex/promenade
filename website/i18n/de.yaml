# Features / Funktionen
features_title: "Hauptmerkmale"
feature_architecture_title: "Clean Architecture"
feature_architecture_desc: "Strikte Schichtenarchitektur mit Domain → Use Case → Adapter → Infrastructure. Echte Trennung der Verantwortlichkeiten."

feature_modules_title: "Plugin-Module"
feature_modules_desc: "Unabhängige vertikale Slices mit eigenen Entities, Migrationen und Lifecycle. Aktivieren/Deaktivieren ohne Core zu beeinflussen."

feature_database_title: "PostgreSQL + UUID v7"
feature_database_desc: "Zeitgeordnete UUIDs für 2x schnellere Inserts. Namespace-basierte Migrationen für echte Modul-Autonomie."

feature_auth_title: "Eingebaute Sicherheit"
feature_auth_desc: "JWT-Authentifizierung, RBAC mit Wildcard-Berechtigungen, Session-Management und Audit-Logging."

feature_events_title: "Event-gesteuert"
feature_events_desc: "Dual-Adapter Event Bus (Memory/Redis) für asynchrone Operationen und Inter-Modul-Kommunikation."

feature_testing_title: "Umfassendes Testen"
feature_testing_desc: "500+ Tests über alle Schichten. Unit-, Integrations- und Smoke-Tests. 100% erfolgreich in unter 25 Sekunden."

