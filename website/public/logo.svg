<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" width="220" height="240">
  <!-- Subtle background gradient - less vibrant but more contrast -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f7ff;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#e8ecff;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5b60d6;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#7078e8;stop-opacity:0.95" />
    </linearGradient>
  </defs>
  
  <!-- Rounded background - taller and wider -->
  <rect x="10" y="10" width="200" height="220" rx="40" fill="url(#bgGradient)"/>
  
  <!-- Abstract "P" letter - scaled up -->
  <!-- Vertical line of P -->
  <rect x="60" y="55" width="26" height="130" rx="13" fill="url(#letterGradient)"/>
  
  <!-- Top curve of P - representing promenade -->
  <path d="M 86 68 Q 150 68 150 102 Q 150 136 115 136 L 86 136" 
        fill="none" 
        stroke="url(#letterGradient)" 
        stroke-width="26" 
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Three dots - workflow/journey -->
  <circle cx="63" cy="168" r="6.5" fill="#5b60d6" opacity="0.75"/>
  <circle cx="86" cy="168" r="6.5" fill="#7078e8" opacity="0.75"/>
  <circle cx="109" cy="168" r="6.5" fill="#8b92f0" opacity="0.75"/>
  
  <!-- Network lines - bounded contexts -->
  <line x1="160" y1="82" x2="172" y2="70" stroke="#5b60d6" stroke-width="3" opacity="0.45" stroke-linecap="round"/>
  <line x1="160" y1="108" x2="178" y2="114" stroke="#7078e8" stroke-width="3" opacity="0.45" stroke-linecap="round"/>
  <line x1="160" y1="134" x2="172" y2="146" stroke="#8b92f0" stroke-width="3" opacity="0.45" stroke-linecap="round"/>
  <circle cx="177" cy="70" r="5.5" fill="#5b60d6" opacity="0.55"/>
  <circle cx="183" cy="114" r="5.5" fill="#7078e8" opacity="0.55"/>
  <circle cx="177" cy="146" r="5.5" fill="#8b92f0" opacity="0.55"/>
</svg>
