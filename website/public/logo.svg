<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160" width="180" height="160">
  <!-- Background gradient matching site theme - more contrast -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eef2ff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Rounded background - wider aspect ratio -->
  <rect x="8" y="8" width="164" height="144" rx="32" fill="url(#bgGradient)"/>
  
  <!-- Abstract "P" letter - more prominent -->
  <!-- Vertical line of P -->
  <rect x="50" y="40" width="22" height="90" rx="11" fill="url(#letterGradient)"/>
  
  <!-- Top curve of P - representing promenade -->
  <path d="M 72 50 Q 125 50 125 75 Q 125 100 98 100 L 72 100" 
        fill="none" 
        stroke="url(#letterGradient)" 
        stroke-width="22" 
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Three dots - workflow/journey -->
  <circle cx="52" cy="118" r="5" fill="#6366f1" opacity="0.7"/>
  <circle cx="72" cy="118" r="5" fill="#818cf8" opacity="0.7"/>
  <circle cx="92" cy="118" r="5" fill="#a78bfa" opacity="0.7"/>
  
  <!-- Network lines - bounded contexts -->
  <line x1="135" y1="62" x2="145" y2="52" stroke="#6366f1" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
  <line x1="135" y1="82" x2="150" y2="87" stroke="#818cf8" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
  <line x1="135" y1="102" x2="145" y2="112" stroke="#a78bfa" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
  <circle cx="150" cy="52" r="4.5" fill="#6366f1" opacity="0.5"/>
  <circle cx="155" cy="87" r="4.5" fill="#818cf8" opacity="0.5"/>
  <circle cx="150" cy="112" r="4.5" fill="#a78bfa" opacity="0.5"/>
</svg>
