<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Subtle background gradient - much lighter -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ede9fe;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Soft rounded square background -->
  <rect x="10" y="10" width="180" height="180" rx="36" fill="url(#bgGradient)"/>
  
  <!-- Abstract "P" letter - subtle gradient -->
  <!-- Vertical line of P -->
  <rect x="60" y="50" width="20" height="100" rx="10" fill="url(#letterGradient)"/>
  
  <!-- Top curve of P - representing a path/promenade -->
  <path d="M 80 60 Q 130 60 130 85 Q 130 110 105 110 L 80 110" 
        fill="none" 
        stroke="url(#letterGradient)" 
        stroke-width="20" 
        stroke-linecap="round"/>
  
  <!-- Three small dots representing workflow/journey - very subtle -->
  <circle cx="60" cy="130" r="5" fill="#818cf8" opacity="0.4"/>
  <circle cx="80" cy="130" r="5" fill="#a78bfa" opacity="0.4"/>
  <circle cx="100" cy="130" r="5" fill="#c4b5fd" opacity="0.4"/>
  
  <!-- Ultra-subtle network lines representing bounded contexts -->
  <line x1="150" y1="70" x2="160" y2="60" stroke="#818cf8" stroke-width="2" opacity="0.2"/>
  <line x1="150" y1="90" x2="165" y2="95" stroke="#a78bfa" stroke-width="2" opacity="0.2"/>
  <line x1="150" y1="110" x2="160" y2="120" stroke="#c4b5fd" stroke-width="2" opacity="0.2"/>
  <circle cx="165" cy="60" r="4" fill="#818cf8" opacity="0.25"/>
  <circle cx="170" cy="95" r="4" fill="#a78bfa" opacity="0.25"/>
  <circle cx="165" cy="120" r="4" fill="#c4b5fd" opacity="0.25"/>
</svg>
