<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Subtle gradient background -->
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ede9fe;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="favLetter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Rounded background -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#favBg)"/>
  
  <!-- Simplified "P" letter for small size -->
  <!-- Vertical line -->
  <rect x="14" y="12" width="5" height="24" rx="2.5" fill="url(#favLetter)"/>
  
  <!-- Top curve of P -->
  <path d="M 19 14 Q 30 14 30 20 Q 30 26 25 26 L 19 26" 
        fill="none" 
        stroke="url(#favLetter)" 
        stroke-width="5" 
        stroke-linecap="round"/>
  
  <!-- Single dot accent -->
  <circle cx="15" cy="32" r="2" fill="#a78bfa" opacity="0.6"/>
</svg>
