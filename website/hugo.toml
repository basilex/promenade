    weight = 5

# Menu configuration - German
[languages.de.menu]
  [[languages.de.menu.main]]
    name = 'Startseite'
    url = '/promenade/de/'
    weight = 1
  [[languages.de.menu.main]]
    name = 'Features'
    url = '/promenade/de/features/'
    weight = 2
  [[languages.de.menu.main]]
    name = 'Dokumentation'
    url = '/promenade/de/docs/'
