  [[languages.uk.menu.main]]
    name = 'Головна'
    url = '/promenade/uk/'
    weight = 1
  [[languages.uk.menu.main]]
    name = 'Можливості'
    url = '/promenade/uk/features/'
    weight = 2
  [[languages.uk.menu.main]]
    name = 'Документація'
    url = '/promenade/uk/docs/'
    weight = 3
  [[languages.uk.menu.main]]
    name = 'Контакти'
    url = '/promenade/uk/contact/'
    weight = 4
  [[languages.uk.menu.main]]
    name = 'GitHub'
