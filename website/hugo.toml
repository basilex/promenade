baseURL = 'https://promenade.dev/'
defaultContentLanguage = 'en'
title = 'Promenade - Production-Ready REST API'

# Enable Git info
enableGitInfo = true

# Markup settings
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Language configuration
[languages]
  [languages.en]
    languageCode = 'en-US'
    languageName = 'English'
    weight = 1
    title = 'Promenade - Production-Ready REST API'
  
  [languages.uk]
    languageCode = 'uk-UA'
    languageName = 'Українська'
    weight = 2
    title = 'Promenade - Продакшн-Готове REST API'
  
  [languages.de]
    languageCode = 'de-DE'
    languageName = 'Deutsch'
    weight = 3
    title = 'Promenade - Produktionsreife REST API'

# Params
[params]
  description = 'Production-ready REST API built with Clean Architecture'
  github = 'https://github.com/basilex/promenade'
  email = 'alexander.vasilenko@gmail.com'
