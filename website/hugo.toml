baseURL = 'https://basilex.github.io/promenade/'  # Change to promenade.com.ua when DNS configured
languageCode = 'en-us'
title = 'Promenade - Production-Ready REST API Framework'

# Enable Git info for last modified dates
enableGitInfo = true

# Markup settings
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow HTML in markdown
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
    style = 'monokai'

# Menu configuration - English
[languages.en.menu]
  [[languages.en.menu.main]]
    name = 'Home'
    url = '/promenade/'
    weight = 1
  [[languages.en.menu.main]]
    name = 'Features'
    url = '/promenade/features/'
    weight = 2
  [[languages.en.menu.main]]
    name = 'Documentation'
    url = '/promenade/docs/'
    weight = 3
  [[languages.en.menu.main]]
    name = 'Contact'
    url = '/promenade/contact/'
    weight = 4
  [[languages.en.menu.main]]
    name = 'GitHub'
    url = 'https://github.com/basilex/promenade'
    weight = 5

# Menu configuration - Ukrainian
