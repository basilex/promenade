{{ define "main" }}
<article class="container-narrow" style="padding: 3rem 0">
  <header style="margin-bottom: 2rem">
    <h1>{{ .Title }}</h1>
    {{ if .Params.description }}
    <p style="font-size: 1.25rem; color: var(--color-gray-600)">{{ .Params.description }}</p>
    {{ end }} {{ if .Date }}
    <p style="color: var(--color-gray-500); font-size: 0.875rem">{{ .Date.Format "January 2, 2006" }}</p>
    {{ end }}
  </header>

  <div class="docs-content">{{ .Content }}</div>

  {{ if .GitInfo }}
  <footer
    style="
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--color-gray-200);
      color: var(--color-gray-500);
      font-size: 0.875rem;
    "
  >
    Last updated: {{ .GitInfo.AuthorDate.Format "January 2, 2006" }}
  </footer>
  {{ end }}
</article>
{{ end }}
