{{ define "main" }}
<div class="container" style="padding: 3rem 0">
  <header style="margin-bottom: 3rem">
    <h1>{{ .Title }}</h1>
    {{ if .Params.description }}
    <p style="font-size: 1.25rem; color: var(--color-gray-600)">{{ .Params.description }}</p>
    {{ end }}
  </header>

  <div class="docs-content">{{ .Content }}</div>

  {{ if .Pages }}
  <section style="margin-top: 3rem">
    <h2>{{ .Title }} Pages</h2>
    <div style="display: grid; gap: 1.5rem; margin-top: 1.5rem">
      {{ range .Pages }}
      <article style="padding: 1.5rem; border: 1px solid var(--color-gray-200); border-radius: 0.5rem">
        <h3><a href="{{ .Permalink }}">{{ .Title }}</a></h3>
        {{ if .Params.description }}
        <p style="color: var(--color-gray-600)">{{ .Params.description }}</p>
        {{ end }}
      </article>
      {{ end }}
    </div>
  </section>
  {{ end }}
</div>
{{ end }}
