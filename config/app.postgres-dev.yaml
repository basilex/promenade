# Development Environment Configuration
# Clean DDD architecture - only essential settings

app:
  name: "Promenade Platform"
  environment: "development"
  version: "0.1.0"

server:
  host: "0.0.0.0"
  port: 8081
  read_timeout: 10s
  write_timeout: 10s

# Centralized database configuration
database:
  driver: "postgres" # Database driver: "postgres" or "sqlite"

  # PostgreSQL - main database
  postgres:
    host: "localhost"
    port: 5433
    user: "system"
    password: "passw0rd"
    database: "promenade_dev"
    sslmode: "disable"

  # Redis - unified connection for all services
  redis:
    addr: "localhost:6379"
    password: ""
    pool_size: 10
    max_retries: 3
    # Logical separation via database numbers
    databases:
      revocation: 0 # JWT token blacklist
      bus: 1 # Event Bus (when redis adapter used)
      cache: 2 # Cache layer
      sessions: 3 # Future: User sessions

jwt:
  secret: "dev-secret-key-change-in-production"
  access_token_duration: 15m
  refresh_token_duration: 168h # 7 days
  issuer: "promenade-platform"

logging:
  level: "debug"
  format: "text"
  add_source: true

# Event Bus - Memory adapter for fast local development
bus:
  adapter: "memory"
  worker_pool_size: 10
  buffer_size: 1000
  retry_attempts: 3
  retry_delay: 1s
  retry_max_delay: 10s
  retry_multiplier: 2.0

# Cache Layer - Redis for development
cache:
  enabled: true
  adapter: "redis" # redis or noop
  prefix: "promenade:dev:"
  default_ttl: "5m"
  ttl:
    # Reference data (rarely changes)
    countries: "1h"
    currencies: "1h"
    languages: "1h"
    timezones: "1h"
    # User data (changes more frequently)
    user_profile: "15m"
    customer: "10m"
    # Session data (short-lived)
    session: "30m"

# Scheduler - Job scheduling and automation
scheduler:
  enabled: true
  worker_pool_size: 10
  max_concurrent_jobs: 5
  health_check_interval: 60s
  default_timeout: 300s
  default_retry_attempts: 3
  default_retry_delay: 60s

# Fiscal integrations
fiscal:
  checkbox:
    api_key: ""
    sandbox: true
    timeout: 30s
  pdf_output_dir: "${FISCAL_PDF_OUTPUT_DIR:-tmp/fiscal/receipts}" # PDF output directory
  shift_open_cron: "0 9 * * *"
  shift_close_cron: "0 23 * * *"
