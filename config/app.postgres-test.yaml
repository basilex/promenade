# Test Environment Configuration
# For integration and unit tests

app:
  name: "Promenade Platform"
  environment: "test"
  version: "0.1.0"

server:
  host: "localhost"
  port: 8082
  read_timeout: 5s
  write_timeout: 5s

database:
  postgres:
    host: "${DB_HOST:-localhost}"
    port: ${DB_PORT:-5433}
    user: "${DB_USER:-system}"
    password: "${DB_PASSWORD:-passw0rd}"
    database: "${DB_NAME:-promenade_test}"
    sslmode: "disable"
  redis:
    addr: "${REDIS_ADDR:-localhost:6380}"
    password: "${REDIS_PASSWORD:-}"
    pool_size: 5
    max_retries: 1
    databases:
      revocation: 0
      bus: 1
      cache: 2
      sessions: 3

jwt:
  secret: "test-secret-key-for-testing-only"
  access_token_duration: 15m
  refresh_token_duration: 168h  # 7 days
  issuer: "promenade-platform"

logging:
  level: "info"
  format: "text"
  add_source: false

# Event Bus - Memory adapter for tests (fast, isolated)
bus:
  adapter: "memory"
  worker_pool_size: 5
  buffer_size: 100
  retry_attempts: 1
  retry_delay: 100ms
  retry_max_delay: 1s
  retry_multiplier: 2.0

# Cache Layer - NoOp adapter for tests (no caching, always fetch fresh)
cache:
  enabled: false
  adapter: "noop"
  prefix: "promenade:test:"
  default_ttl: "1m"
  ttl:
    countries: "1m"
    currencies: "1m"
    languages: "1m"
    timezones: "1m"
    user_profile: "1m"
    customer: "1m"
    session: "1m"
