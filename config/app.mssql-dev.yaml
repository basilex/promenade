# Development Environment Configuration (MS SQL Server)
# Clean DDD architecture - only essential settings

app:
  name: "Promenade Platform"
  environment: "development"
  version: "0.1.0"

server:
  host: "0.0.0.0"
  port: 8081
  read_timeout: 10s
  write_timeout: 10s

# Centralized database configuration
database:
  driver: "mssql" # Database driver: "postgres" or "mssql"

  # MS SQL Server - main database
  mssql:
    host: "localhost"
    port: 1433
    user: "sa"
    password: "YourStrong@Passw0rd"
    database: "promenade_dev"
    instance: "" # Optional: named instance like "SQLEXPRESS"
    encrypt: "disable"
    trust_server_certificate: true

  # Redis - unified connection for all services
  redis:
    addr: "localhost:6379"
    password: ""
    pool_size: 10
    max_retries: 3
    # Logical separation via database numbers
    databases:
      revocation: 0 # JWT token blacklist
      bus: 1 # Event Bus (when redis adapter used)
      cache: 2 # Cache layer
      sessions: 3 # Future: User sessions

jwt:
  secret: "dev-secret-key-change-in-production"
  access_token_duration: 15m
  refresh_token_duration: 168h # 7 days
  issuer: "promenade-platform"

logging:
  level: "debug"
  format: "text"
  add_source: true

# Event Bus Configuration
event_bus:
  adapter: "memory" # Options: "memory" (dev) or "redis" (prod)

# Cache Configuration
cache:
  adapter: "memory" # Options: "memory" (dev) or "redis" (prod)
  ttl: 300 # Default TTL in seconds (5 min)
  cleanup_interval: 600 # Memory cache cleanup (10 min)

# CORS Configuration
cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
    - "OPTIONS"
  allowed_headers:
    - "Authorization"
    - "Content-Type"
    - "X-Request-ID"
  expose_headers:
    - "X-Request-ID"
  allow_credentials: true
  max_age: 3600

# Rate Limiting
rate_limit:
  enabled: false # Disabled in development
  requests_per_second: 100
  burst: 200

# Module Configuration
modules:
  identity:
    enabled: true
  customer_management:
    enabled: true
  order_management:
    enabled: true
  billing:
    enabled: true
  warehouse:
    enabled: true
  fiscal:
    enabled: true
  scripting:
    enabled: false # Disabled by default (security)
