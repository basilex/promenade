# Promenade Module Configuration
# This file controls which modules are enabled and their settings

modules:
  # List of enabled modules (in load order)
  enabled:
    - posts # User-generated content: posts + comments + likes
    - profiles # User profiles + contacts (merged into one module)
    - analytics # Analytics & reporting (Free)
    - audit # Immutable audit logging (Commercial)
    - billing # Subscription billing & payment processing (Commercial)

  # Per-module configuration
  config:
    posts:
      version: "1.0.0"
      description: "User-generated content management (posts, comments, likes)"
      settings:
        max_post_length: 10000
        max_comment_length: 2000
        max_comment_depth: 10
        allow_media: true

    profiles:
      version: "1.0.0"
      settings:
        allow_public_profiles: true

    analytics:
      version: "1.0.0"
      description: "Advanced analytics, metrics, reports, and dashboards"
      license_key: "" # Set via ANALYTICS_LICENSE_KEY environment variable

    audit:
      version: "1.0.0"
      description: "Immutable audit logging with cryptographic signatures (Commercial)"
      license_key: "" # Set via AUDIT_LICENSE_KEY environment variable
      settings:
        metrics_retention_days: 90
        max_reports_per_user: 10
        max_dashboards_per_user: 5

    billing:
      version: "1.0.0"
      description: "Subscription billing and payment processing (Commercial)"
      license_key: "" # Set via BILLING_LICENSE_KEY environment variable
      settings:
        default_currency: "USD"
        default_trial_days: 14
        invoice_due_days: 14
        enable_refunds: true
        enable_trial_periods: true
