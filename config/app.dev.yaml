# Development Environment Configuration
# Clean DDD architecture - only essential settings

app:
  name: "Promenade CRM"
  environment: "development"
  version: "0.1.0"

server:
  host: "0.0.0.0"
  port: 8081
  read_timeout: 10s
  write_timeout: 10s

# Centralized database configuration
database:
  # PostgreSQL - main database
  postgres:
    host: "localhost"
    port: 5432
    user: "system"
    password: "passw0rd"
    database: "promenade_dev"
    sslmode: "disable"
  
  # Redis - unified connection for all services
  redis:
    addr: "localhost:6379"
    password: ""
    pool_size: 10
    max_retries: 3
    # Logical separation via database numbers
    databases:
      revocation: 0  # JWT token blacklist
      bus: 1         # Event Bus (when redis adapter used)
      cache: 2       # Future: Cache layer
      sessions: 3    # Future: User sessions

jwt:
  secret: "dev-secret-key-change-in-production"
  access_token_duration: 15m
  refresh_token_duration: 168h  # 7 days
  issuer: "promenade-crm"

logging:
  level: "debug"
  format: "text"
  add_source: true

# Event Bus - Memory adapter for fast local development
bus:
  adapter: "memory"
  worker_pool_size: 10
  buffer_size: 1000
  retry_attempts: 3
  retry_delay: 1s
  retry_max_delay: 10s
  retry_multiplier: 2.0
