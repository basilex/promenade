# Development Environment Configuration
# For local development with hot-reload and debug features

app:
  name: "Promenade"
  environment: "development"
  debug: true
  version: "1.0.0"
  url: "http://localhost:8081"

server:
  host: "localhost"
  port: 8081
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 10s

database:
  host: "localhost"
  port: 5432
  user: "system"
  password: "passw0rd"
  database: "promenade_dev"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m
  conn_max_idle_time: 10m

jwt:
  secret: "xTV/YnVTg4aoOiNLrLipZZMQfLwZDgDaEMBxzSz6l1s=" # Dev secret only!
  access_token_duration: 15m
  refresh_token_duration: 168h # 7 days
  issuer: "promenade-api-dev"

logging:
  level: "debug"
  format: "text" # Human-readable for development
  output: "stdout"
  file_path: "logs/dev.log"

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:8081"
    - "http://127.0.0.1:3000"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
    - "OPTIONS"
  allowed_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
  allow_credentials: true
  max_age: 12h

# Event Bus - Memory adapter for fast local development
bus:
  adapter: "memory"
  worker_pool_size: 4
  buffer_size: 100
  retry_attempts: 3
  retry_delay: 1s

  redis:
    host: "localhost"
    port: 6379
    password: ""
    db: 0
    max_retries: 3
    pool_size: 10

rate_limit:
  enabled: true
  requests_per_second: 100
  burst: 200

# Development features
swagger:
  enabled: true
  host: "localhost:8081"

email:
  enabled: false # Disabled in dev, use mock
  smtp_host: "smtp.mailtrap.io"
  smtp_port: 2525
  username: ""
  password: ""
  from_address: "dev@promenade.local"
  from_name: "Promenade Dev"

# Automated purge system - Core infrastructure only
# Retention policies are defined in each module's config
purge:
  enabled: true
  schedule: "0 3 * * *" # 3 AM daily
  dry_run: false
  batch_size: 100
