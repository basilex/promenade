# Development Environment Configuration
# Clean DDD architecture - only essential settings

app:
  name: "Promenade CRM"
  environment: "development"
  version: "0.1.0"

server:
  host: "0.0.0.0"
  port: 8081
  read_timeout: 10s
  write_timeout: 10s

database:
  host: "localhost"
  port: 5432
  user: "system"
  password: "passw0rd"
  database: "promenade_dev"
  sslmode: "disable"

jwt:
  secret: "dev-secret-key-change-in-production"
  access_token_duration: 15m
  refresh_token_duration: 168h  # 7 days
  issuer: "promenade-crm"

logging:
  level: "debug"
  format: "text"
  add_source: true

# Event Bus - Memory adapter for fast local development
bus:
  adapter: "memory"
  worker_pool_size: 10
  buffer_size: 1000
  retry_attempts: 3
  retry_delay: 1s
  retry_max_delay: 10s
  retry_multiplier: 2.0
  redis:
    host: "localhost"
    port: 6379
    password: ""
    db: 0
    max_retries: 3
    pool_size: 10
