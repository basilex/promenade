# Production Environment Configuration
# Production-ready settings with security enabled

app:
  name: "Promenade Platform"
  environment: "production"
  version: "0.1.0"

server:
  host: "0.0.0.0"
  port: 8081
  read_timeout: 10s
  write_timeout: 10s

database:
  postgres:
    host: "${DB_HOST}"
    port: 5432
    user: "${DB_USER}"
    password: "${DB_PASSWORD}"
    database: "${DB_NAME}"
    ssl_mode: "require"
  redis:
    addr: "${REDIS_ADDR:-localhost:6379}"
    password: "${REDIS_PASSWORD}"
    pool_size: 20
    max_retries: 3
    databases:
      revocation: 0
      bus: 1
      cache: 2
      sessions: 3

logging:
  level: "info"
  format: "json"
  add_source: false

# Event Bus - Redis adapter for production (distributed, persistent)
bus:
  adapter: "redis"
  worker_pool_size: 20
  buffer_size: 5000
  retry_attempts: 5
  retry_delay: 2s
  retry_max_delay: 30s
  retry_multiplier: 2.0
