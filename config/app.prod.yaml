# Production Environment Configuration
# Production-ready settings with security enabled

app:
  name: "Promenade CRM"
  environment: "production"
  version: "0.1.0"

server:
  host: "0.0.0.0"
  port: 8081
  read_timeout: 10s
  write_timeout: 10s

database:
  host: "${DB_HOST}"
  port: 5432
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"
  database: "${DB_NAME}"
  ssl_mode: "require"

logging:
  level: "info"
  format: "json"
  add_source: false

# Event Bus - Redis adapter for production (distributed, persistent)
bus:
  adapter: "redis"
  worker_pool_size: 20
  buffer_size: 5000
  retry_attempts: 5
  retry_delay: 2s
  retry_max_delay: 30s
  retry_multiplier: 2.0
  redis:
    host: "${REDIS_HOST:-localhost}"
    port: 6379
    password: "${REDIS_PASSWORD}"
    db: 0
    max_retries: 3
    pool_size: 20
