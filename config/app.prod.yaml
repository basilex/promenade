# Production Environment Configuration
# Production-ready settings with security enabled

app:
  name: "Promenade CRM"
  environment: "production"
  version: "0.1.0"

server:
  host: "0.0.0.0"
  port: 8081
  read_timeout: 10s
  write_timeout: 10s

database:
  host: "${DB_HOST}"
  port: 5432
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"
  database: "${DB_NAME}"
  ssl_mode: "require"

logging:
  level: "info"
  format: "json"
  add_source: false
