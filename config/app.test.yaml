# Test Environment Configuration
# For integration and unit tests

app:
  name: "Promenade Platform"
  environment: "test"
  version: "0.1.0"

server:
  host: "localhost"
  port: 8082
  read_timeout: 5s
  write_timeout: 5s

database:
  postgres:
    host: "localhost"
    port: 5433
    user: "system"
    password: "passw0rd"
    database: "promenade_test"
    ssl_mode: "disable"
  redis:
    addr: "localhost:6380"
    password: ""
    pool_size: 5
    max_retries: 1
    databases:
      revocation: 0
      bus: 1
      cache: 2
      sessions: 3

logging:
  level: "info"
  format: "text"
  add_source: false

# Event Bus - Memory adapter for tests (fast, isolated)
bus:
  adapter: "memory"
  worker_pool_size: 5
  buffer_size: 100
  retry_attempts: 1
  retry_delay: 100ms
  retry_max_delay: 1s
  retry_multiplier: 2.0
