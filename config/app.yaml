# Core Application Configuration
# This config contains only core-level settings
# Module-specific configs are in config/modules/*.yaml

app:
  name: "Promenade API"
  environment: "development" # development, staging, production
  debug: true
  version: "1.0.0"

server:
  host: "localhost"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 10s

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  database: "promenade"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m
  conn_max_idle_time: 10m

jwt:
  secret: "your-secret-key-change-in-production"
  access_token_duration: 15m
  refresh_token_duration: 168h # 7 days
  issuer: "promenade-api"

logging:
  level: "debug" # debug, info, warn, error
  format: "json" # json, text
  output: "stdout" # stdout, file
  file_path: "logs/app.log"

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
    - "OPTIONS"
  allowed_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
  allow_credentials: true
  max_age: 12h

# Event Bus Configuration
bus:
  adapter: "memory" # memory, redis
  worker_pool_size: 4
  buffer_size: 100
  retry_attempts: 3
  retry_delay: 1s

  # Redis adapter settings (when adapter=redis)
  redis:
    host: "localhost"
    port: 6379
    password: ""
    db: 0
    max_retries: 3
    pool_size: 10

# Rate Limiting (core level)
rate_limit:
  enabled: true
  requests_per_second: 100
  burst: 200

# Email Configuration (if core handles email)
email:
  enabled: false
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  username: ""
  password: ""
  from_address: "noreply@promenade.com"
  from_name: "Promenade"
