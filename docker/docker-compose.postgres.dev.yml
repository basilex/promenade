services:
  postgres:
    image: postgres:16-alpine
    container_name: promenade-postgres-dev
    environment:
      POSTGRES_USER: system
      POSTGRES_PASSWORD: passw0rd
      POSTGRES_DB: promenade_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.postgres.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - promenade-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U system"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: promenade-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - promenade-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  promenade-network:
    driver: bridge
