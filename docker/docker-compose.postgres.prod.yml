services:
  postgres:
    image: postgres:16-alpine
    container_name: promenade-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER:-system}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-passw0rd}
      POSTGRES_DB: ${DB_NAME:-promenade_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - promenade-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-system}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: promenade-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    networks:
      - promenade-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: promenade:latest
    container_name: promenade-app-prod
    environment:
      # Server
      - DATABASE_DRIVER=postgres
      - ENVIRONMENT=production
      - SERVER_PORT=8080
      # Database
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-system}
      - DB_PASSWORD=${DB_PASSWORD:-passw0rd}
      - DB_NAME=${DB_NAME:-promenade_prod}
      - DB_SSLMODE=disable
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TTL_MINUTES=15
      - JWT_REFRESH_TTL_HOURS=168
      # Event Bus
      - BUS_ADAPTER=redis
      - BUS_WORKER_POOL_SIZE=10
      - BUS_BUFFER_SIZE=1000
      - BUS_RETRY_ATTEMPTS=3
      - BUS_RETRY_DELAY=1s
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - REDIS_POOL_SIZE=20
    ports:
      - "8080:8080"
    networks:
      - promenade-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  promenade-network:
    driver: bridge
