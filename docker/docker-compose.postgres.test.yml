services:
  postgres:
    image: postgres:16-alpine
    container_name: promenade-postgres-test
    environment:
      POSTGRES_USER: system
      POSTGRES_PASSWORD: passw0rd
      POSTGRES_DB: promenade_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U system -d promenade_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: promenade-redis-test
    ports:
      - "6380:6379" # Use different port to avoid conflicts with dev Redis
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
  redis_test_data:
