services:
  postgres:
    image: postgres:16-alpine
    container_name: promenade_postgres
    environment:
      POSTGRES_USER: system
      POSTGRES_PASSWORD: passw0rd
      POSTGRES_DB: promenade_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - promenade-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U system"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: promenade_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - promenade-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    container_name: promenade_migrate
    volumes:
      - ../migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgresql://system:passw0rd@postgres:5432/promenade_prod?sslmode=disable"
      - "up"
    networks:
      - promenade-network
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: promenade:latest
    container_name: promenade_app
    environment:
      # Server
      - ENVIRONMENT=production
      - SERVER_PORT=8080
      # Database
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=system
      - DB_PASSWORD=passw0rd
      - DB_NAME=promenade_prod
      - DB_SSLMODE=disable
      # JWT
      - JWT_SECRET=xTV/YnVTg4aoOiNLrLipZZMQfLwZDgDaEMBxzSz6l1s=
      - JWT_ACCESS_TTL_MINUTES=15
      - JWT_REFRESH_TTL_HOURS=168
      # Event Bus
      - BUS_WORKER_POOL_SIZE=10
      - BUS_BUFFER_SIZE=1000
      - BUS_RETRY_ATTEMPTS=3
      - BUS_RETRY_DELAY=1s
      # Email
      - EMAIL_FROM_ADDRESS=noreply@promenade.com
      - EMAIL_FROM_NAME=Promenade Team
      - APP_URL=http://localhost:8080
      - APP_NAME=Promenade
    ports:
      - "8080:8080"
    networks:
      - promenade-network
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  promenade-network:
    driver: bridge
