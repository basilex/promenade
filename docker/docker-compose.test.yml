version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: promenade_test_db
    environment:
      POSTGRES_USER: system
      POSTGRES_PASSWORD: passw0rd
      POSTGRES_DB: promenade_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U system -d promenade_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
