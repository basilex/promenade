# MS SQL Server Production Environment
# Docker Compose configuration for production with MS SQL Server 2022

version: "3.8"

services:
  # MS SQL Server 2022 (Linux container)
  # NOTE: For production, consider using managed MS SQL Server (Azure SQL, AWS RDS)
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: promenade-mssql-prod
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${MSSQL_SA_PASSWORD:-ChangeThisPassword123!}
      - MSSQL_PID=Standard # Standard edition (requires license)
      - MSSQL_TCP_PORT=1433
      - MSSQL_AGENT_ENABLED=true
      - MSSQL_MEMORY_LIMIT_MB=4096
    ports:
      - "1433:1433"
    volumes:
      - mssql-prod-data:/var/opt/mssql
      - mssql-backup:/var/opt/mssql/backup
      - ./init-db.mssql.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P ${MSSQL_SA_PASSWORD:-ChangeThisPassword123!} -Q "SELECT 1" || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 2G
    networks:
      - promenade-network

  # Redis (production configuration)
  redis:
    image: redis:7-alpine
    container_name: promenade-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis-prod-data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: redis-cli -a ${REDIS_PASSWORD:-changeme} ping || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - promenade-network

volumes:
  mssql-prod-data:
  mssql-backup:
  redis-prod-data:

networks:
  promenade-network:
    driver: bridge
