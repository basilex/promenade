info:
  contact:
    email: alexander.vasilenko@gmail.com
    name: API Support
    url: https://github.com/basilex/promenade
  description: Production-ready REST API built with Clean Architecture, featuring
    PostgreSQL with UUID v7, comprehensive testing infrastructure, JWT authentication,
    and API versioning.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Promenade API
  version: "1.0"
paths:
  /api/v1/admin/purge/policies:
    get:
      description: Returns all configured retention policies for soft-deleted records
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_basilex_promenade_internal_adapter_http_shared_response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_basilex_promenade_internal_adapter_http_v1_dto.RetentionPolicyResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_internal_adapter_http_shared_response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_internal_adapter_http_shared_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_internal_adapter_http_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Get retention policies
      tags:
      - Admin
  /api/v1/admin/purge/preview/{entity_name}:
    get:
      description: Returns the count of records that would be purged for a specific
        entity without actually deleting them
      parameters:
      - description: Entity name
        enum:
        - user_posts
        - post_comments
        in: path
        name: entity_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_basilex_promenade_internal_adapter_http_shared_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_basilex_promenade_internal_adapter_http_v1_dto.PurgePreviewResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_internal_adapter_http_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_internal_adapter_http_shared_response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_internal_adapter_http_shared_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_internal_adapter_http_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Preview purge operation
      tags:
      - Admin
  /api/v1/admin/purge/scheduler/status:
    get:
      description: Returns the current status of the automatic purge scheduler
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_basilex_promenade_internal_adapter_http_shared_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_basilex_promenade_internal_adapter_http_v1_dto.SchedulerStatusResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_internal_adapter_http_shared_response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_internal_adapter_http_shared_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_internal_adapter_http_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Get scheduler status
      tags:
      - Admin
  /api/v1/admin/purge/trigger:
    post:
      consumes:
