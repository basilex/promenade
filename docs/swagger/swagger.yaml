info:
  contact:
    email: alexander.vasilenko@gmail.com
    name: API Support
    url: https://github.com/basilex/promenade
  description: Modern backend platform for customer management, orders, and business
    workflows with clean DDD architecture
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Promenade Platform
  version: 0.1.0
paths:
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Generate new access token using refresh token
      parameters:
      - description: Refresh token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_contexts_identity_user_adapter_http.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_contexts_identity_user_adapter_http.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_pkg_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_pkg_response.Response'
      summary: Refresh access token
      tags:
      - auth
  /auth/revoke:
    post:
      consumes:
      - application/json
      description: Revoke the current JWT access token (logout)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_pkg_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_pkg_response.Response'
      security:
      - BearerAuth: []
      summary: Revoke current token
      tags:
      - auth
  /billing/payments:
    get:
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_contexts_billing_payment_adapter_http.PaymentResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_pkg_response.Response'
      summary: List payments
      tags:
      - Payments
    post:
      consumes:
      - application/json
      parameters:
      - description: Payment data
        in: body
        name: payment
