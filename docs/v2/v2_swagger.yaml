info:
  contact:
    email: alexander.vasilenko@gmail.com
    name: API Support
    url: https://github.com/basilex/promenade
  description: Production-ready REST API built with Clean Architecture, featuring
    PostgreSQL with UUID v7, comprehensive testing infrastructure, JWT authentication,
    and API versioning.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Promenade API
  version: "1.0"
paths:
  /api/v1/audit/events:
    get:
      description: List audit events with filters and pagination
      parameters:
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      - description: Filter by action
        in: query
        name: action
        type: string
      - description: Filter by entity type
        in: query
        name: entity_type
        type: string
      - description: Filter by entity ID
        in: query
        name: entity_id
        type: string
      - description: Filter from date (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Filter to date (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_basilex_promenade_pkg_response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_modules_audit_adapter_http_handler.AuditEventResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List audit events
      tags:
      - audit
    post:
      consumes:
      - application/json
      description: Create a new immutable audit event
      parameters:
      - description: Audit event data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_audit_adapter_http_handler.CreateAuditEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_basilex_promenade_pkg_response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_audit_adapter_http_handler.AuditEventResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create audit event
      tags:
      - audit
  /api/v1/audit/events/{id}:
    get:
      description: Get audit event by ID
      parameters:
      - description: Audit Event ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_basilex_promenade_pkg_response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_audit_adapter_http_handler.AuditEventResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_pkg_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get audit event
      tags:
      - audit
  /api/v1/audit/events/{id}/verify:
    get:
      description: Verify HMAC-SHA256 signature of audit event
      parameters:
      - description: Audit Event ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_basilex_promenade_pkg_response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_audit_adapter_http_handler.VerifyAuditEventResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_pkg_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Verify audit event signature
      tags:
      - audit
  /api/v1/audit/events/entity/{entity_type}/{entity_id}:
    get:
      description: Get all audit events for a specific entity
      parameters:
      - description: Entity type
        in: path
        name: entity_type
        required: true
        type: string
      - description: Entity ID (UUID)
        in: path
        name: entity_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
