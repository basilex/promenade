                    $ref: '#/definitions/internal_modules_audit_adapter_http_handler.AuditEventResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_pkg_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_basilex_promenade_pkg_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get audit events by entity
      tags:
      - audit
